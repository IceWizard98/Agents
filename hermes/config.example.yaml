# Hermes config template. Copy to config.yaml (gitignored) on setup:
#   cp hermes/config.example.yaml hermes/config.yaml
# Hermes rewrites config.yaml at runtime (migrate, /sethome, ...), so the live
# file is not versioned — only this template is. Secrets stay in .env, not here.

# Model: Claude Max subscription via the claude-max-api-proxy service. Hermes talks
# OpenAI /v1/chat/completions to a "custom provider" (providers.claude-max below); the
# proxy runs the genuine Claude Code CLI on CLAUDE_CODE_OAUTH_TOKEN. This is the ALLOWED
# path (real CLI binary) — NOT feeding the OAuth token to a raw third-party HTTP client.
model:
  provider: claude-max
  # Bare CLI tier aliases — each resolves to the LATEST model of that family
  # (opus => Opus 5, sonnet => Sonnet 5, haiku => Haiku 4.5). Using the aliases (not
  # the proxy's cosmetic claude-*-4 ids) keeps /model from showing a misleading "4".
  # cont-init overwrites this from HERMES_MODEL on boot (Coolify: change env + redeploy).
  default: haiku

# Custom OpenAI-compatible provider = the in-stack proxy. cont-init overwrites `api`
# from HERMES_BASE_URL on boot. Key comes from OPENAI_API_KEY (any value; the proxy has
# no auth and is only reachable on the internal agents_net).
providers:
  claude-max:
    api: http://claude-max-api-proxy:3456/v1
    key_env: OPENAI_API_KEY
    default_model: haiku
    # Lets `/model` list all three tiers in-chat without a network probe.
    models: [opus, sonnet, haiku]

# Failover on 429/503/529/connection error. Optional free OpenRouter model — only used
# if OPENROUTER_API_KEY is set; harmless to leave otherwise.
fallback_model:
  provider: openrouter
  model: poolside/laguna-s-2.1:free

# Telegram is activated by the TELEGRAM_* env vars; Hermes also records the
# home channel here after /sethome.
platforms:
  telegram:
    enabled: true

# Skills pushed via `just sync-*` (mirrored). Personal and flattened plugin skills
# live in separate dirs so one mirror can't wipe the other.
skills:
  external_dirs:
    - /opt/data/skills
    - /opt/data/plugin-skills

# External tools over MCP (streamable HTTP on the agents_net network).
# Solo i server usati in chat: ogni server elencato qui rispedisce il suo schema
# tool a OGNI turno (stateless), quindi meno server = meno token per messaggio.
mcp_servers:
  google:
    url: http://mcp-google:9000/mcp
  icloud:
    url: http://mcp-icloud:9001/mcp
  paperclip:
    url: http://mcp-paperclip:9500/mcp
