# agent-system stack.
# hermes (Nous Research) = runtime + Telegram chat + MCP client, on a Claude Code session.
# claude-max-api-proxy = Claude Max subscription exposed as an OpenAI API (hermes brain).
# mcp-* = MCP servers (tools) attached to hermes: google, icloud, fetch, supermemory.
# supermemory = self-hosted persistent memory (behind mcp-supermemory).
# Local: `docker compose up -d --build`. Coolify: import this file + env secrets.
name: agents

networks:
  agents_net:
    driver: bridge

volumes:
  hermes_data: {}
  google_tokens: {}
  claude_proxy_home: {}
  supermemory_data: {}

services:
  # ---- Hermes: AI worker + chat gateway (Telegram) + MCP client ----
  hermes:
    build: ./hermes   # official image + cont-init (seed config, apply HERMES_MODEL)
    command: ["gateway", "run"]
    environment:
      # Brain via claude-max-api-proxy: Hermes speaks OpenAI to the proxy, which runs
      # the genuine Claude Code CLI on the Max subscription. cont-init registers a
      # native "custom provider" (providers.claude-max) from these three vars:
      #   HERMES_MODEL   -> model.default (bare tier alias: haiku => Haiku 4.5,
      #                     sonnet => Sonnet 5, opus => Opus 5)
      #   HERMES_BASE_URL-> providers.claude-max.api
      #   OPENAI_API_KEY -> key for that provider (any value; proxy auth off by default)
      - HERMES_MODEL=${HERMES_MODEL:-haiku}
      - HERMES_BASE_URL=${HERMES_BASE_URL:-http://claude-max-api-proxy:3456/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-local-proxy}
      # Second custom provider: Google Gemini, direct via its OpenAI-compatible
      # endpoint (no proxy — an API key is allowed over raw HTTP). Switch brains with
      # HERMES_PROVIDER=gemini (default claude-max); GEMINI_MODEL sets model.default
      # when gemini is active (a claude tier alias like `haiku` would 400 at Google).
      - HERMES_PROVIDER=${HERMES_PROVIDER:-claude-max}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      # OpenRouter kept for the config fallback_model only (free rollover on 429).
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # API server (internal, :8642): external gateway entrypoint into hermes.
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${API_SERVER_KEY}
      # Telegram channel.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - TELEGRAM_HOME_CHANNEL=${TELEGRAM_HOME_CHANNEL}
    volumes:
      # config.yaml is seeded into this volume from the image template on first boot
      # (hermes/config.example.yaml), then owned by Hermes. Model comes from HERMES_MODEL.
      - hermes_data:/opt/data
    networks: [agents_net]
    # 8642 = API server (internal). No domain needed.
    restart: unless-stopped
    depends_on:
      claude-max-api-proxy:
        condition: service_healthy
      mcp-google:
        condition: service_started
      mcp-icloud:
        condition: service_started
      mcp-fetch:
        condition: service_started
      mcp-supermemory:
        condition: service_started

  # ---- Claude Max proxy: subscription as OpenAI API (hermes brain) ----
  # Our own planner proxy (claude-max-api-proxy/) driving the genuine Claude Code CLI
  # (`claude --print`) on CLAUDE_CODE_OAUTH_TOKEN — the ALLOWED path (same binary as
  # `coding`), NOT a header-spoofed HTTP call. Hermes calls it over OpenAI
  # /v1/chat/completions; its tools are framed as "actions" the model PROPOSES and
  # Hermes executes (real tool-calling). Tool-bearing turns auto-upgrade haiku->sonnet
  # (haiku can't follow the planner protocol); plain chat stays on the requested model.
  claude-max-api-proxy:
    build: ./claude-max-api-proxy
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - PORT=3456
      # No auth knob: the published npm package (1.0.0) has none. The proxy is
      # unauthenticated but reachable only on the internal agents_net (no `ports:`
      # mapping), so only stack containers can call it. Single-user deployment.
    volumes:
      # Persist the CLI's ~/.claude (config/cache) so it doesn't re-init each boot.
      - claude_proxy_home:/root/.claude
    networks: [agents_net]
    restart: unless-stopped

  # ---- MCP servers (hermes tools) ----
  mcp-google:
    build: ./mcp-google
    environment:
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      # Optional: pin the single-user Google account.
      - USER_GOOGLE_EMAIL=${USER_GOOGLE_EMAIL:-}
      # OAuth redirect base (…/oauth2callback must be reachable by the browser
      # doing consent). Auto-picked up from Coolify's magic SERVICE_URL_MCP_GOOGLE
      # (injected automatically once this service has a domain assigned in the
      # Coolify UI — e.g. SERVICE_URL_MCP_GOOGLE=https://mcp-google.example.com).
      # WORKSPACE_MCP_BASE_URI still wins if set explicitly (local dev, non-Coolify prod).
      - WORKSPACE_MCP_BASE_URI=${WORKSPACE_MCP_BASE_URI:-${SERVICE_URL_MCP_GOOGLE:-http://localhost}}
    volumes:
      - google_tokens:/data
    networks: [agents_net]
    ports:
      - "9000:9000"   # OAuth redirect (…/oauth2callback) must reach the browser doing consent
    restart: unless-stopped

  mcp-icloud:
    build: ./mcp-icloud
    environment:
      - ICLOUD_SMTP_USER=${ICLOUD_SMTP_USER}
      - ICLOUD_SMTP_APP_PASSWORD=${ICLOUD_SMTP_APP_PASSWORD}
      - ICLOUD_FROM=${ICLOUD_FROM:-}
    networks: [agents_net]
    restart: unless-stopped

  # FlareSolverr: drives a real browser to pass Cloudflare/DDoS-Guard challenges
  # that block plain chromium/curl. Plain HTTP API on :8191 — hermes reaches it via
  # the mcp-fetch tool below, not directly. Internal only (no host port); bundles its
  # own browser. NOTE: official image is amd64 — on Apple-Silicon/colima it may not
  # start (the Coolify prod host is x86, so prod is fine).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
    networks: [agents_net]
    restart: unless-stopped

  # mcp-fetch: wraps FlareSolverr as an MCP `fetch_url` tool for hermes (streamable
  # HTTP on :9002). Custom Go server (same pattern as mcp-icloud).
  mcp-fetch:
    build: ./mcp-fetch
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    networks: [agents_net]
    restart: unless-stopped
    depends_on:
      flaresolverr:
        condition: service_started

  # supermemory: self-hosted memory engine (REST on :6767). Single binary, embedded
  # graph engine + local Xenova embeddings, no external DB. Internal only — hermes
  # reaches it via mcp-supermemory below. LLM (used only on WRITE: fact extraction,
  # contradiction resolution) is switchable via SUPERMEMORY_LLM_* — default points at
  # the in-stack claude-max-api-proxy; set them to OpenRouter to route elsewhere.
  # Memory ceiling: local ONNX embeddings hold the model resident; cap keeps a spike
  # from OOM-ing the box (recurring failure mode on this host).
  supermemory:
    build: ./supermemory
    environment:
      - SUPERMEMORY_EMBEDDING_PROVIDER=${SUPERMEMORY_EMBEDDING_PROVIDER:-local}
      - OPENAI_BASE_URL=${SUPERMEMORY_LLM_BASE_URL:-http://claude-max-api-proxy:3456/v1}
      - OPENAI_API_KEY=${SUPERMEMORY_LLM_API_KEY:-sk-local-proxy}
      - OPENAI_MODEL=${SUPERMEMORY_LLM_MODEL:-sonnet}
    volumes:
      # Mounts at the data dir (SUPERMEMORY_DATA_DIR=/data in the image), NOT the
      # install dir (/root/.supermemory) — mounting over the latter would shadow
      # the installed binary and the server would fail to start on first boot.
      - supermemory_data:/data
    networks: [agents_net]
    restart: unless-stopped
    # Liveness: curl exits 0 on any HTTP response, non-zero only on connection
    # refused — so a failed boot / OOM restart-loop is visible instead of silent.
    # start_period covers the first-boot embedding-model download (~106MB).
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:6767/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      # Write-path fact-extraction calls the proxy; start it first so early
      # ingests don't fail extraction (v3 doc-search would still work without it).
      claude-max-api-proxy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Measured at boot: baseline ~1.2G + the server's own ingest budget
          # (+1G, "memory limit above baseline" log) => ~2.2G write-time peak, so
          # 2G would OOM. 3G leaves margin; the box has ~5G free. Lower the app's
          # own budget with SUPERMEMORY_EMBEDDING_RAM_LIMIT if this must shrink.
          memory: 3G

  # mcp-supermemory: wraps the supermemory REST API as MCP tools (add_memory,
  # search_memory) for hermes (streamable HTTP on :9003). Custom Go server (same
  # pattern as mcp-fetch). The self-hosted binary is REST-only; this is the bridge.
  mcp-supermemory:
    build: ./mcp-supermemory
    environment:
      - SUPERMEMORY_URL=http://supermemory:6767
      # Default scope so single-user memories group together across calls.
      - SUPERMEMORY_CONTAINER_TAG=${SUPERMEMORY_CONTAINER_TAG:-hermes}
      # supermemory auto-applies its key only to localhost; cross-container calls
      # need it explicitly. The server writes it to <data-dir>/api-key on boot; we
      # read it from the volume (mounted read-only below). Override with
      # SUPERMEMORY_API_KEY only to pin a specific key.
      - SUPERMEMORY_API_KEY=${SUPERMEMORY_API_KEY:-}
      - SUPERMEMORY_API_KEY_FILE=/sm/api-key
      # Per-request timeout: the write path runs synchronous LLM fact-extraction.
      - SUPERMEMORY_TIMEOUT_SECONDS=${SUPERMEMORY_TIMEOUT_SECONDS:-120}
    volumes:
      # Read-only: only to read the auto-generated api-key the server persists.
      - supermemory_data:/sm:ro
    networks: [agents_net]
    restart: unless-stopped
    depends_on:
      supermemory:
        condition: service_started
